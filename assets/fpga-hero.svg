<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Animated three-dimensional FPGA vehicle controller</title><desc id="desc">A glowing FPGA routes signals to a rotating electric motor and battery controller.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#0a1631"/><stop offset="1" stop-color="#12072a"/></linearGradient>
<linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#456db3"/><stop offset="1" stop-color="#0b1634"/></linearGradient>
<linearGradient id="battery" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2de2a6"/><stop offset="1" stop-color="#117c81"/></linearGradient>
<radialGradient id="motor"><stop stop-color="#a9e8ff"/><stop offset=".3" stop-color="#2e9df4"/><stop offset=".75" stop-color="#18327b"/><stop offset="1" stop-color="#0b143b"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="25"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5d7fc8" stroke-opacity=".12"/></pattern>
<style>.float{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.float2{animation:float 5s ease-in-out -1s infinite;transform-box:fill-box;transform-origin:center}.spin{animation:spin 3.8s linear infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 2s ease-in-out infinite}.dash{stroke-dasharray:13 19;animation:dash 1.1s linear infinite}@keyframes float{50%{transform:translateY(-10px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes dash{to{stroke-dashoffset:-64}}</style>
</defs>
<rect width="1200" height="520" fill="url(#bg)"/><rect width="1200" height="520" fill="url(#grid)"/><ellipse cx="600" cy="305" rx="390" ry="150" fill="#176cb6" opacity=".22" filter="url(#soft)" class="pulse"/>
<g class="float2"><path d="M80 170h140l30 28H110z" fill="#14295c" stroke="#5486d5"/><text x="100" y="197" fill="#8fd6ff" font-family="monospace" font-size="15">PWM / ADC</text></g><path d="M250 197h200" fill="none" stroke="#54dbf3" stroke-width="3" class="dash" filter="url(#glow)"/>
<path d="M730 245c95 0 77-75 145-75" fill="none" stroke="#8f6bff" stroke-width="3" class="dash" filter="url(#glow)"/><path d="M720 330c82 0 95 46 165 46" fill="none" stroke="#3ee1b0" stroke-width="3" class="dash" filter="url(#glow)"/>
<g class="float"><path d="M450 170l130-70 230 45-130 78z" fill="#385b99"/><path d="M450 170v137l230 58V223z" fill="url(#chip)"/><path d="M680 223l130-78v138L680 365z" fill="#0b1635"/><path d="M450 170l230 53 130-78-230-45z" fill="#25467e" stroke="#6faeff" stroke-width="2"/>
<g fill="#68dfff" filter="url(#glow)"><rect x="507" y="186" width="24" height="11" rx="2"/><rect x="550" y="196" width="24" height="11" rx="2"/><rect x="593" y="205" width="24" height="11" rx="2"/><rect x="636" y="214" width="24" height="11" rx="2"/></g><text x="511" y="278" fill="#d5edff" font-family="monospace" font-size="21" font-weight="bold">ARTIX-7</text><text x="523" y="302" fill="#79bfff" font-family="monospace" font-size="13">HYBRID CONTROL</text></g>
<g transform="translate(874 100)" class="float2"><path d="M0 55l40-22 132 29-38 23z" fill="#1e4e5d"/><path d="M0 55v105l134 35V85z" fill="#103c4e"/><path d="M134 85l38-23v101l-38 32z" fill="#0a263d"/><rect x="34" y="91" width="63" height="64" rx="5" fill="url(#battery)" filter="url(#glow)"/><text x="24" y="184" fill="#a9ffe7" font-family="monospace" font-size="12">REGEN ENERGY</text></g>
<g transform="translate(865 220)" class="float"><ellipse cx="113" cy="95" rx="91" ry="28" fill="#061022" opacity=".7"/><circle cx="100" cy="77" r="72" fill="#112259" stroke="#5aaeff" stroke-width="4"/><circle cx="100" cy="77" r="57" fill="url(#motor)"/><g class="spin" fill="#86dfff" filter="url(#glow)"><path d="M97 18h7l15 51-19 8-18-8z"/><path d="M151 46l4 6-40 35-14-14 8-18z"/><path d="M155 105l-4 6-52-12 1-20 20-1z"/><path d="M104 136h-8l-15-51 19-8 18 8z"/><path d="M49 108l-4-6 40-35 14 14-8 18z"/><path d="M45 49l4-6 52 12-1 20-20 1z"/></g><circle cx="100" cy="77" r="18" fill="#d7f8ff"/><circle cx="100" cy="77" r="8" fill="#174a90"/></g>
<g font-family="Arial,sans-serif"><text x="76" y="302" fill="#d9eeff" font-size="43" font-weight="700">MUHAMMAD UMAIR ALI</text><text x="79" y="341" fill="#78c7ff" font-size="20" letter-spacing="4">DIGITAL DESIGN · FPGA · ENERGY SYSTEMS</text><text x="79" y="383" fill="#b3c5ed" font-family="monospace" font-size="16">Designing the control layer where hardware meets motion.</text></g><path d="M78 421h260" stroke="#3c75bc"/><circle cx="78" cy="421" r="5" fill="#4cf5c7" filter="url(#glow)"/><text x="95" y="427" fill="#87a9d7" font-family="monospace" font-size="14">SYSTEM ONLINE</text>
</svg>
